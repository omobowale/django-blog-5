<!doctype html>
{%  load static %}
<html>

<head>

    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
    <title>Login</title>

</head>

<body>
    <div class="page">
        <h1 class="page-title">Login</h1>

        <div class="form-card">
            <form method="POST">
                {% csrf_token %}

                {% if form.errors %}
                    <p class="post-title">Invalid username or password</p>
                {% endif %}

                <div class="form-field">
                    <label for="id_username">Username</label>
                    <input id="id_username" name="username" type="text" placeholder="Enter username" />
                </div>

                <div class="form-field">
                    <label for="id_password">Password</label>
                    <input id="id_password" name="password" type="password" placeholder="Enter password" />
                </div>

                <button type="submit">Login</button>

            </form>
        </div>
    </div>
</body>


</html>
