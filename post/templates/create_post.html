    {% extends 'base.html' %}


    {% block title %}
        Create Post
    {% endblock %}

    


    {% block pageTitle %}
        Create Post
    {% endblock %}

    {% block content %}

        <div class="form-card">
            <form method="POST" action="/posts/create">
                {% csrf_token %}

                <div class="form-field">
                    <label for="id_title">Title</label>
                    <input id="id_title" name="title" type="text" placeholder="Enter title" value="{{ form.title.value|default_if_none:'' }}" >
                    <span class="error-msg">{{ form.title.errors }}</span>
                </div>

                <div class="form-field">
                    <label for="id_content">Content</label>
                    <textarea id="id_content" name="content" placeholder="Enter content">{{ form.content.value|default_if_none:'' }}</textarea>
                    <span class="error-msg">{{ form.content.errors }}</span>
                </div>

                <button type="submit">Create post</button>

            </form>
        </div>

    {% endblock %}
